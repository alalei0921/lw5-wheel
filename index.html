<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#FFF6F0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Lw&5" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <title>Lw&5之家</title>
  <style>
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","SF Pro Display","Helvetica Neue",Arial,sans-serif;
      color:#2d2d2d;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      position:relative;
      overflow:hidden;
    }
    body::before{
      content:"";
      position:fixed;
      inset:0;
      background:
        linear-gradient(180deg, rgba(255,245,250,.10), rgba(255,250,240,.16)),
        url('./home-bg.jpg') center/cover no-repeat;
      z-index:-2;
      transform:scale(1.02);
    }
    body::after{
      content:"";
      position:fixed;
      inset:0;
      background: radial-gradient(circle at 20% 20%, rgba(255,255,255,.16), transparent 35%),
                  radial-gradient(circle at 80% 80%, rgba(255,255,255,.10), transparent 40%);
      z-index:-1;
    }
    .card{
      width:min(430px,92%);
      border-radius:22px;
      background:rgba(255,255,255,.30);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border:1px solid rgba(255,255,255,.50);
      box-shadow:0 14px 34px rgba(112,76,52,.12);
      padding:16px 14px 12px;
      text-align:center;
      transform: translateY(-78px);
      transition:transform .72s cubic-bezier(.22,.78,.22,1),filter .72s ease,opacity .52s ease;
    }
    h1{
      margin:0;
      font-size:30px;
      letter-spacing:.5px;
      color:#7c4a37;
      text-shadow:0 2px 8px rgba(255,255,255,.55);
    }
    .sub{
      margin:5px 0 12px;
      color:#7b6f68;
      font-size:12px;
      font-weight:700;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:8px;
    }
    .tool-btn{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      text-decoration:none;
      min-height:56px;
      border-radius:16px;
      padding:10px;
      font-size:14.5px;
      line-height:1.18;
      font-weight:700;
      text-align:left;
      border:1px solid rgba(255,255,255,.58);
      box-shadow:0 10px 18px rgba(130,99,76,.10);
      transition:transform .14s ease, box-shadow .14s ease, filter .14s ease;
      color:#5b4438;
    }
    .tool-btn span:first-child{min-width:0;overflow-wrap:anywhere}
    .tool-btn:not(.wide){font-size:14px;gap:6px}
    .tool-btn:not(.wide) span:first-child{white-space:nowrap}
    .tool-btn:not(.wide) .emoji{font-size:20px}
    .tool-btn.wide{
      grid-column:1/-1;
      min-height:50px;
      padding:10px 12px;
      font-size:15px;
    }
    .tool-btn:active{transform:translateY(1px) scale(.98)}
    .tool-btn:hover{transform:translateY(-2px); box-shadow:0 14px 24px rgba(130,99,76,.2)}
    .wheel{background:linear-gradient(135deg,rgba(255,230,243,.66),rgba(255,244,216,.58))}
    .stock{background:linear-gradient(135deg,rgba(232,247,255,.66),rgba(234,255,234,.58))}
    .emoji{font-size:22px;flex:0 0 auto}
    .foot{margin-top:10px;font-size:12px;color:#7a6a61;font-weight:700;text-shadow:0 1px 6px rgba(255,255,255,.72)}

    /* 工具面板（保持在同一页里，BGM 不断） */
    .tool-overlay{
      position: fixed;
      inset: 0;
      display: none;
      z-index: 160;
    }
    .tool-overlay.show{ display:block; }
    .tool-overlay .backdrop{
      position:absolute;
      inset:0;
      background: rgba(0,0,0,.35);
      backdrop-filter: blur(2px);
    }
    .tool-panel{
      position:absolute;
      left: 50%;
      transform: translateX(-50%);
      width: min(920px, 96vw);
      background: rgba(255,255,255,.85);
      border: 1px solid rgba(255,255,255,.75);
      border-radius: 22px;
      box-shadow: 0 28px 70px rgba(0,0,0,.22);
      overflow: hidden;
    }
    .tool-panel.full{
      inset:0;
      width:100%;
      height:100%;
      transform:none;
      border:0;
      border-radius:0;
      background:#fff;
      box-shadow:none;
      display:flex;
      flex-direction:column;
    }
    .full .tool-topbar{flex:none;padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));}
    .full .tool-iframe{display:block;flex:1;min-height:0;height:auto;padding-bottom:env(safe-area-inset-bottom,0px);}
    .tool-panel.loading .tool-iframe{visibility:hidden}
    .tool-loading{position:absolute;inset:65px 0 0;display:grid;align-content:center;justify-items:center;gap:16px;background:#fff;color:#374151;font-size:15px}
    .tool-loading[hidden]{display:none}
    .tool-loading::before{content:"";width:26px;height:26px;border:3px solid #dce7ec;border-top-color:#147aa0;border-radius:50%;animation:tool-spin .8s linear infinite}
    .tool-loading.failed::before{display:none}
    .tool-loading button{padding:10px 22px;border:1px solid #c6d7df;border-radius:8px;background:#f4f9fb;color:#17526a;font:inherit}
    @keyframes tool-spin{to{transform:rotate(360deg)}}
    body.tool-active .sun-press,body.tool-active .nebula-overlay{visibility:hidden;pointer-events:none;}
    .tool-panel.sheet{
      bottom: 10px;
      height: min(78vh, 720px);
    }
    .tool-topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 12px 12px;
      background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.72));
      border-bottom: 1px solid rgba(0,0,0,.06);
    }
    .tool-title{
      font-weight: 900;
      color:#7c4a37;
      font-size: 14px;
      letter-spacing: .2px;
    }
    .cute-close{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 10px 12px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.75);
      background: rgba(255,255,255,.72);
      box-shadow: 0 10px 18px rgba(0,0,0,.10);
      font-weight: 900;
      color:#111827;
      cursor:pointer;
      user-select:none;
    }
    .cute-close:active{ transform: scale(.98); }

    .tool-iframe{
      width: 100%;
      height: calc(100% - 50px);
      border: 0;
      background: #fff;
    }

    .music-btn{
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
      z-index: 60;
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 10px 12px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.72);
      background: rgba(255,255,255,.62);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow:0 14px 28px rgba(112,76,52,.16);
      font-weight:800;
      color:#7c4a37;
      cursor:pointer;
      user-select:none;
      transition:opacity .42s ease,transform .48s cubic-bezier(.2,.8,.2,1);
    }
    .music-btn:active{ transform: translateY(1px) scale(.98); }
    .sun-press{
      position:fixed;
      left:calc(50vw - 13.2vh + 4px);
      top:calc(4.25vh - 3px);
      z-index:145;
      width:clamp(54px,7.45vh,86px);
      aspect-ratio:1;
      padding:0;
      overflow:visible;
      isolation:isolate;
      border-radius:50%;
      border:0;
      background:transparent;
      box-shadow:none;
      opacity:1;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      transition:opacity .18s ease,transform .24s ease,filter .18s ease;
    }
    .sun-press::before{
      content:"";
      position:absolute;
      inset:-24%;
      z-index:1;
      border-radius:50%;
      background:
        radial-gradient(circle at 17% 31%,rgba(255,250,209,1) 0 1.2px,rgba(255,194,57,.42) 1.8px,transparent 3px),
        radial-gradient(circle at 29% 71%,rgba(255,211,77,.98) 0 1.1px,transparent 2.6px),
        radial-gradient(circle at 43% 17%,rgba(255,249,201,.98) 0 1.4px,rgba(255,170,32,.34) 2px,transparent 3.2px),
        radial-gradient(circle at 56% 82%,rgba(255,183,42,.96) 0 1.2px,transparent 2.8px),
        radial-gradient(circle at 72% 25%,rgba(255,244,174,1) 0 1.5px,rgba(255,180,31,.38) 2.2px,transparent 3.4px),
        radial-gradient(circle at 84% 58%,rgba(255,205,65,.98) 0 1.1px,transparent 2.7px),
        radial-gradient(circle at 65% 67%,rgba(255,250,215,.94) 0 .9px,transparent 2.4px),
        radial-gradient(circle at 23% 52%,rgba(255,171,24,.94) 0 1px,transparent 2.5px),
        radial-gradient(circle at 48% 47%,rgba(255,248,192,.96) 0 1.1px,transparent 2.6px),
        radial-gradient(circle at 78% 79%,rgba(255,230,125,.92) 0 .9px,transparent 2.3px),
        radial-gradient(circle at 38% 88%,rgba(255,193,48,.90) 0 .8px,transparent 2.2px),
        radial-gradient(circle at 91% 39%,rgba(255,248,203,.92) 0 .8px,transparent 2.1px);
      -webkit-mask-image:radial-gradient(circle,#000 0 58%,rgba(0,0,0,.84) 70%,transparent 88%);
      mask-image:radial-gradient(circle,#000 0 58%,rgba(0,0,0,.84) 70%,transparent 88%);
      filter:drop-shadow(0 0 3px rgba(255,191,42,.96)) drop-shadow(0 0 7px rgba(255,219,101,.58));
      animation:sunNebulaParticles 3.2s linear infinite;
    }
    .sun-press::after{
      content:"";
      position:absolute;
      inset:-30%;
      z-index:0;
      border-radius:50%;
      background:
        radial-gradient(circle,rgba(255,252,220,.38) 0 9%,rgba(255,213,78,.23) 25%,rgba(255,166,22,.09) 45%,transparent 68%),
        repeating-conic-gradient(from 12deg,rgba(255,235,154,.38) 0 1.2deg,transparent 2.4deg 17deg,rgba(255,177,38,.24) 18deg 19deg,transparent 20deg 34deg);
      -webkit-mask-image:radial-gradient(circle,rgba(0,0,0,.96) 0 26%,rgba(0,0,0,.68) 50%,transparent 76%);
      mask-image:radial-gradient(circle,rgba(0,0,0,.96) 0 26%,rgba(0,0,0,.68) 50%,transparent 76%);
      filter:blur(.55px) drop-shadow(0 0 9px rgba(255,205,72,.50));
      animation:sunNebulaOrbit 5.4s linear infinite;
    }
    .sun-press:active{
      opacity:.72;
      filter:brightness(1.20);
    }
    .sun-press.working{
      opacity:0;
      transform:scale(.88);
      pointer-events:none;
    }
    .sun-press:disabled{cursor:wait}
    .sun-press.nebula-live::before,.sun-press.nebula-live::after{display:none}
    body.nebula-active .card{
      transform:translateY(-78px) scale(.975);
      filter:brightness(.58) saturate(.72) blur(1.2px);
      opacity:.74;
    }
    body.nebula-active .music-btn{
      opacity:0;
      pointer-events:none;
      transform:translateY(-8px) scale(.96);
    }
    .home-toast{
      position:fixed;
      left:50%;
      bottom:max(18px,env(safe-area-inset-bottom));
      z-index:95;
      width:min(410px,calc(100% - 30px));
      padding:12px 14px;
      border-radius:16px;
      background:rgba(45,36,31,.88);
      color:#fff;
      box-shadow:0 16px 34px rgba(56,39,31,.22);
      font-size:14px;
      font-weight:850;
      text-align:center;
      opacity:0;
      pointer-events:none;
      transform:translateX(-50%) translateY(14px);
      transition:opacity .18s ease, transform .18s ease;
    }
    .home-toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }
    .nebula-overlay{
      --nebula-level:0;
      --nebula-energy:0;
      --sun-x:50vw;
      --sun-y:8vh;
      --sun-radius:34px;
      --sun-size:68px;
      --nebula-reveal-radius:34px;
      --nebula-feather:24px;
      --nebula-open-duration:.68s;
      --nebula-close-duration:.56s;
      --nebula-mini-x:0px;
      --nebula-mini-y:0px;
      --nebula-mini-scale:.24;
      position:fixed;
      inset:0;
      z-index:140;
      display:grid;
      place-items:center;
      overflow:hidden;
      background:
        radial-gradient(circle at 50% 47%, rgba(39,78,148,calc(.14 + var(--nebula-energy) * .04)), transparent 39%),
        radial-gradient(circle at 50% 46%, rgba(255,240,160,calc(.015 + var(--nebula-energy) * .30)), transparent 31%),
        radial-gradient(circle at 42% 58%, rgba(68,211,255,calc(.055 + var(--nebula-energy) * .15)), transparent 42%),
        radial-gradient(circle at 62% 38%, rgba(189,113,255,calc(.050 + var(--nebula-energy) * .105)), transparent 46%),
        rgba(1,3,11,.985);
      opacity:1;
      pointer-events:none;
      clip-path:circle(calc(var(--nebula-reveal-radius) + var(--nebula-feather) + 2px) at var(--sun-x) var(--sun-y));
      -webkit-clip-path:circle(calc(var(--nebula-reveal-radius) + var(--nebula-feather) + 2px) at var(--sun-x) var(--sun-y));
      -webkit-mask-image:radial-gradient(circle at var(--sun-x) var(--sun-y),#000 0, #000 calc(var(--nebula-reveal-radius) - var(--nebula-feather)),rgba(0,0,0,.88) calc(var(--nebula-reveal-radius) - 8px),rgba(0,0,0,.42) calc(var(--nebula-reveal-radius) + 14px),transparent calc(var(--nebula-reveal-radius) + var(--nebula-feather)));
      mask-image:radial-gradient(circle at var(--sun-x) var(--sun-y),#000 0, #000 calc(var(--nebula-reveal-radius) - var(--nebula-feather)),rgba(0,0,0,.88) calc(var(--nebula-reveal-radius) - 8px),rgba(0,0,0,.42) calc(var(--nebula-reveal-radius) + 14px),transparent calc(var(--nebula-reveal-radius) + var(--nebula-feather)));
      -webkit-mask-repeat:no-repeat;
      mask-repeat:no-repeat;
      transition:opacity .18s ease;
      touch-action:none;
      user-select:none;
      -webkit-user-select:none;
      will-change:clip-path,-webkit-mask-image,mask-image;
    }
    .nebula-overlay:not(.priming):not(.expanding):not(.expanded):not(.collapsing){
      opacity:0;
    }
    .nebula-overlay::before{
      content:"";
      position:absolute;
      inset:-18%;
      z-index:0;
      background:
        conic-gradient(from 0deg at 50% 50%, rgba(255,226,132,.08), rgba(66,210,255,.13), rgba(189,113,255,.11), rgba(255,150,99,.10), rgba(255,226,132,.08));
      filter:blur(22px) brightness(calc(.62 + var(--nebula-energy) * 1.08)) saturate(calc(.75 + var(--nebula-energy) * .65));
      opacity:calc(.28 + var(--nebula-energy) * .54);
      animation:nebulaDrift 18s linear infinite;
    }
    .nebula-overlay::after{
      content:"";
      position:absolute;
      inset:-12%;
      z-index:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 50% 47%, rgba(255,255,235,calc(.02 + var(--nebula-energy) * .34)) 0, rgba(255,204,103,calc(.01 + var(--nebula-energy) * .20)) 16%, transparent 42%),
        radial-gradient(circle at 50% 47%, transparent 19%, rgba(102,223,255,calc(.01 + var(--nebula-energy) * .15)) 37%, transparent 62%);
      mix-blend-mode:screen;
      opacity:calc(.15 + var(--nebula-energy) * .85);
    }
    .nebula-overlay.expanding,
    .nebula-overlay.expanded{
      pointer-events:auto;
    }
    .nebula-overlay.expanded{
      clip-path:none;
      -webkit-clip-path:none;
      -webkit-mask-image:none;
      mask-image:none;
    }
    .nebula-overlay.priming{
      pointer-events:auto;
    }
    .nebula-overlay.collapsing{
      pointer-events:auto;
    }
    .nebula-overlay.done{
      --nebula-energy:1;
    }
    .nebula-overlay.interacting .nebula-core{
      animation-duration:.78s;
    }
    .nebula-overlay.interacting .nebula-ring{
      filter:brightness(calc(.85 + var(--nebula-energy) * .90)) saturate(1.3);
    }
    .nebula-overlay.interacting .nebula-fallback{
      filter:saturate(calc(.92 + var(--nebula-energy) * .82)) brightness(calc(.52 + var(--nebula-energy) * 1.28));
    }
    .nebula-canvas{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      z-index:1;
      filter:brightness(calc(.78 + var(--nebula-energy) * .40)) saturate(calc(.92 + var(--nebula-energy) * .42)) contrast(calc(.99 + var(--nebula-energy) * .07));
      transition:filter .08s linear;
    }
    .nebula-stage{
      position:relative;
      z-index:0;
      width:min(64vw,300px);
      aspect-ratio:1;
      display:grid;
      place-items:center;
      pointer-events:none;
      transform:translate(var(--nebula-mini-x),var(--nebula-mini-y)) scale(var(--nebula-mini-scale));
      transform-origin:center;
      transition:transform var(--nebula-open-duration) cubic-bezier(.22,.62,.24,1),filter .40s ease;
      will-change:transform;
    }
    .nebula-overlay.expanding .nebula-stage,
    .nebula-overlay.expanded .nebula-stage{
      transform:translate(0,0) scale(1);
    }
    .nebula-overlay.collapsing .nebula-stage{
      transform:translate(var(--nebula-mini-x),var(--nebula-mini-y)) scale(var(--nebula-mini-scale));
      transition-duration:var(--nebula-close-duration);
      transition-timing-function:cubic-bezier(.50,0,.28,1);
    }
    .nebula-radiance{
      position:absolute;
      inset:-34%;
      border-radius:50%;
      background:repeating-conic-gradient(from 0deg, rgba(255,244,183,.30) 0 1deg, transparent 2deg 11deg, rgba(103,224,255,.20) 12deg 13deg, transparent 14deg 25deg);
      filter:blur(5px);
      mix-blend-mode:screen;
      opacity:calc(.035 + var(--nebula-energy) * .30);
      animation:nebulaRadiance 26s linear infinite;
    }
    .nebula-fallback{
      width:78%;
      aspect-ratio:1;
      border-radius:50%;
      position:absolute;
      inset:11%;
      overflow:hidden;
      background:
        radial-gradient(circle at 36% 32%, rgba(145,198,255,.60), rgba(49,91,150,.62) 18%, rgba(31,41,94,.72) 42%, rgba(35,19,70,.60) 62%, rgba(3,8,22,.06) 73%),
        conic-gradient(from 90deg, rgba(36,116,169,.58), rgba(50,61,127,.62), rgba(91,50,139,.60), rgba(37,74,132,.55), rgba(36,116,169,.58));
      opacity:calc(.60 + var(--nebula-energy) * .40);
      filter:saturate(calc(.96 + var(--nebula-energy) * .68)) brightness(calc(.60 + var(--nebula-energy) * 1.22));
      box-shadow:0 0 calc(18px + var(--nebula-energy) * 82px) rgba(113,218,255,calc(.22 + var(--nebula-energy) * .42)), 0 0 calc(32px + var(--nebula-energy) * 132px) rgba(246,193,86,calc(.02 + var(--nebula-energy) * .40)), inset 0 0 36px rgba(190,226,255,calc(.10 + var(--nebula-energy) * .23));
      animation:nebulaPulse 2.8s ease-in-out infinite;
    }
    .nebula-fallback::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius:50%;
      background:
        radial-gradient(circle at 36% 32%, rgba(255,255,255,.96), rgba(126,236,255,.60) 18%, rgba(73,100,255,.34) 39%, rgba(255,190,94,.28) 62%, rgba(255,255,255,.03) 73%),
        conic-gradient(from 90deg, rgba(71,207,255,.45), rgba(255,214,112,.50), rgba(177,107,255,.46), rgba(255,151,104,.34), rgba(71,207,255,.45));
      mix-blend-mode:screen;
      opacity:var(--nebula-energy);
    }
    .nebula-core{
      width:26%;
      aspect-ratio:1;
      border-radius:50%;
      position:absolute;
      background:
        radial-gradient(circle at 35% 32%, rgba(154,210,255,.88), rgba(58,98,166,.76) 34%, rgba(35,38,106,.70) 60%, rgba(20,25,73,.18) 78%, transparent 82%);
      opacity:calc(.62 + var(--nebula-energy) * .38);
      filter:brightness(calc(.78 + var(--nebula-energy) * 1.14)) saturate(calc(1 + var(--nebula-energy) * .40));
      box-shadow:0 0 calc(8px + var(--nebula-energy) * 54px) rgba(114,190,255,calc(.20 + var(--nebula-energy) * .34)), 0 0 calc(22px + var(--nebula-energy) * 128px) rgba(255,190,89,calc(var(--nebula-energy) * .54));
      animation:nebulaCore 1.8s ease-in-out infinite;
    }
    .nebula-core::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius:50%;
      background:radial-gradient(circle at 35% 32%, #fff, #fff4ad 34%, rgba(255,168,74,.72) 58%, rgba(88,206,255,.18) 78%, transparent 82%);
      mix-blend-mode:screen;
      opacity:var(--nebula-energy);
    }
    .nebula-ring{
      position:absolute;
      width:92%;
      aspect-ratio:1;
      border-radius:50%;
      border:1px solid rgba(182,238,255,.34);
      box-shadow:0 0 28px rgba(91,219,255,.18);
      opacity:calc(.30 + var(--nebula-energy) * .62);
      filter:brightness(calc(.95 + var(--nebula-energy) * .65));
      transform:rotateX(66deg) rotateZ(0deg);
      animation:nebulaOrbit 5.4s linear infinite;
    }
    .nebula-ring.two{
      width:72%;
      border-color:rgba(255,221,132,.30);
      animation-duration:4.2s;
      animation-direction:reverse;
      transform:rotateX(58deg) rotateZ(42deg);
    }
    .nebula-ring.three{
      width:112%;
      border-color:rgba(198,144,255,.26);
      animation-duration:7.2s;
      transform:rotateX(74deg) rotateZ(-36deg);

  <script>
    // Register PWA service worker
    (function(){
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    })();

    // One-click update: unregister SW + clear caches + hard reload
    (function(){
      const btn = document.getElementById('updateBtn');
      if (!btn) return;
      btn.addEventListener('click', async () => {
        if (btn.disabled) return;
        if (!navigator.onLine) { window.LW5UI?.notify('当前离线，联网后再更新；已保存的数据不会改变'); return; }
        btn.disabled = true;
        btn.textContent = '🍬 更新中...';
        try{
          const check = await window.LW5UI.fetch('./sw.js?check=' + Date.now(), {cache:'no-store',timeoutMs:10000});
          if (!check.ok) throw new Error('更新服务暂不可用');
          const scope = new URL('./', location.href).href;
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.filter(r => r.scope === scope).map(r => r.unregister()));
          }
          if (window.caches) {
            const keys = await caches.keys();
            await Promise.all(keys.filter(k => k.startsWith('lw5-home-')).map(k => caches.delete(k)));
          }
        }catch(_){
          btn.disabled = false;
          btn.textContent = '🧁 一键更新';
          window.LW5UI?.notify('更新失败，请检查网络后重试；本地数据已保留');
          return;
        }
        // cache-busting reload
        const url = new URL(location.href);
        url.searchParams.set('v', String(Date.now()));
        location.href = url.toString();
      });
    })();

    (function(){
      const sunBtn = document.getElementById('sunPress');
      const toast = document.getElementById('homeToast');
      const nebulaOverlay = document.getElementById('nebulaOverlay');
      const nebulaStatus = document.getElementById('nebulaStatus');
      const nebulaHint = document.getElementById('nebulaHint');
      const nebulaBack = document.getElementById('nebulaBack');
      const nebulaBurst = nebulaOverlay?.querySelector('.nebula-burst');
      const LOCAL_ORIGIN = 'http://192.168.1.105:8788';
      const LOCAL_CONTROL_URL = LOCAL_ORIGIN + '/sun-mode?from=home';
      const LOCAL_PROBE_URL = LOCAL_ORIGIN + '/assets/hyperion-bg.jpg';
      const VISUAL_TEST = new URL(location.href).searchParams.get('visual-test') === '1';
      const LIGHT_SEQUENCE = [
        { loop: 9, name: '主卧射灯' },
        { loop: 4, name: '客厅射灯' },
        { loop: 3, name: '客厅吊灯' },
        { loop: 1, name: '玄关灯带' },
        { loop: 2, name: '玄关射灯' },
        { loop: 5, name: '餐厅吊灯' },
        { loop: 6, name: '餐厅射灯' },
        { loop: 8, name: '主卧吊灯' },
        { loop: 7, name: '衣帽间' },
      ];
      const STEP_COUNT = LIGHT_SEQUENCE.length;
      const HOME_VISUAL_STEP = 4;
      const PRIME_DURATION = 120;
      const OPEN_DURATION = 680;
      const CLOSE_DURATION = 560;
      const LOCAL_CONNECT_TIMEOUT = 1500;
      const RECENT_LOCAL_KEY = 'lw5_nebula_recent_local_v1';
      const RECENT_LOCAL_TTL = 5 * 60 * 1000;
      let toastTimer = null;
      let nebulaStep = 0;
      let nebulaMode = 'mini';
      let transitionToken = 0;
      let localControlConnected = false;
      let localConnectPromise = null;
      let localConnectController = null;
      let localConnectSequence = 0;
      let commandQueue = Promise.resolve();
      window.__nebulaProgress = 0;
      window.__nebulaEnergy = 0;
      window.__nebulaExpansion = 0;

      function showHomeToast(message){
        if (!toast) return;
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
      }

      function clamp(value, min, max){
        return Math.max(min, Math.min(max, value));
      }

      function setLocalControlState(state, message){
        if (!nebulaHint) return;
        const labels = {
          idle:'展开后自动连接本地控制',
          connecting:'正在连接本地控制…',
          connected:'已连接',
          retry:'未连接，点击重试',
        };
        nebulaHint.classList.remove('idle', 'connecting', 'connected', 'retry');
        nebulaHint.classList.add(state);
        nebulaHint.textContent = message || labels[state] || labels.retry;
        const canEnterLocal = state === 'retry';
        nebulaHint.setAttribute('aria-disabled', String(!canEnterLocal));
        if (canEnterLocal) {
          nebulaHint.setAttribute('href', LOCAL_CONTROL_URL);
        } else {
          nebulaHint.removeAttribute('href');
        }
      }

      function rememberRecentLocalHandoff(){
        try {
          localStorage.setItem(RECENT_LOCAL_KEY, String(Date.now()));
        } catch (_) { }
      }

      function hasRecentLocalHandoff(){
        try {
          const lastHandoff = Number(localStorage.getItem(RECENT_LOCAL_KEY));
          return Number.isFinite(lastHandoff) && Date.now() - lastHandoff < RECENT_LOCAL_TTL;
        } catch (_) {
          return false;
        }
      }

      function enterLocalControl(sequence, message){
        rememberRecentLocalHandoff();
        setLocalControlState('connecting', message || '已找到本地控制，正在进入…');
        window.setTimeout(() => {
          if (sequence === localConnectSequence && nebulaMode === 'expanded') {
            window.location.assign(LOCAL_CONTROL_URL + '&ts=' + Date.now());
          }
        }, 80);
      }

      function resetLocalControlConnection(){
        localConnectSequence += 1;
        localConnectController?.abort();
        localConnectController = null;
        localConnectPromise = null;
        localControlConnected = false;
        setLocalControlState('idle');
      }

      function connectLocalControl(){
        if (nebulaMode !== 'expanded') return Promise.resolve(false);
        if (VISUAL_TEST) {
          localControlConnected = false;
          setLocalControlState('retry', '视觉测试模式：点击可重试本地连接');
          return Promise.resolve(false);
        }
        if (localControlConnected) {
          setLocalControlState('connected');
          return Promise.resolve(true);
        }
        if (localConnectPromise) return localConnectPromise;

        if (hasRecentLocalHandoff()) {
          const recentSequence = ++localConnectSequence;
          enterLocalControl(recentSequence, '正在恢复本地控制…');
          return Promise.resolve(true);
        }

        const sequence = ++localConnectSequence;
        const controller = new AbortController();
        const image = new Image();
        localConnectController = controller;
        setLocalControlState('connecting');

        localConnectPromise = new Promise((resolve) => {
          let settled = false;
          let failedProbes = 0;
          const timeout = window.setTimeout(() => finish(false), LOCAL_CONNECT_TIMEOUT);
          const probeFailed = () => {
            failedProbes += 1;
            if (failedProbes >= 2) finish(false);
          };
          const finish = (available) => {
            if (settled) return;
            settled = true;
            window.clearTimeout(timeout);
            image.onload = null;
            image.onerror = null;
            if (sequence !== localConnectSequence || controller.signal.aborted || nebulaMode !== 'expanded') {
              resolve(false);
              return;
            }
            localConnectController = null;
            localConnectPromise = null;
            localControlConnected = false;
            controller.abort();
            if (available) {
              enterLocalControl(sequence);
              resolve(true);
              return;
            }
            setLocalControlState('retry');
            resolve(false);
          };
          controller.signal.addEventListener('abort', () => finish(false), { once:true });
          image.onload = () => finish(true);
          image.onerror = probeFailed;
          image.src = LOCAL_PROBE_URL + '?probe=' + Date.now();
          fetch(LOCAL_ORIGIN + '/api/ping?ts=' + Date.now(), {
            mode:'cors',
            cache:'no-store',
            credentials:'omit',
            targetAddressSpace:'local',
            signal:controller.signal,
          }).then(async (response) => {
            const data = await response.json().catch(() => ({}));
            if (!response.ok || data.ok !== true) throw new Error('本地服务未响应');
            finish(true);
          }).catch(probeFailed);
        });
        return localConnectPromise;
      }

      function setNebulaReveal(expansion, sunRect = window.__nebulaSunRect){
        if (!nebulaOverlay || !sunRect) return;
        const progress = clamp(Number(expansion) || 0, 0, 1);
        const startRadius = sunRect.width / 2;
        const farthestX = Math.max(sunRect.centerX, window.innerWidth - sunRect.centerX);
        const farthestY = Math.max(sunRect.centerY, window.innerHeight - sunRect.centerY);
        const fullRadius = Math.hypot(farthestX, farthestY) + 96;
        const revealRadius = startRadius + (fullRadius - startRadius) * progress;
        const feather = 24 + Math.sin(Math.PI * progress) * 54;
        nebulaOverlay.style.setProperty('--nebula-reveal-radius', revealRadius + 'px');
        nebulaOverlay.style.setProperty('--nebula-feather', feather + 'px');
      }

      function syncSunGeometry(){
        if (!sunBtn || !nebulaOverlay) return;
        const rect = sunBtn.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const stageSize = Math.min(window.innerWidth * .64, 300);
        const miniScale = clamp(rect.width / Math.max(1, stageSize * 1.12), .15, .34);
        const miniX = centerX - window.innerWidth / 2;
        const miniY = centerY - window.innerHeight / 2;
        nebulaOverlay.style.setProperty('--sun-x', centerX + 'px');
        nebulaOverlay.style.setProperty('--sun-y', centerY + 'px');
        nebulaOverlay.style.setProperty('--sun-radius', (rect.width / 2) + 'px');
        nebulaOverlay.style.setProperty('--sun-size', rect.width + 'px');
        nebulaOverlay.style.setProperty('--nebula-mini-x', miniX + 'px');
        nebulaOverlay.style.setProperty('--nebula-mini-y', miniY + 'px');
        nebulaOverlay.style.setProperty('--nebula-mini-scale', String(miniScale));
        window.__nebulaSunRect = {
          left:rect.left,
          top:rect.top,
          width:rect.width,
          height:rect.height,
          centerX,
          centerY,
        };
        setNebulaReveal(window.__nebulaExpansion, window.__nebulaSunRect);
      }

      function animateExpansion(target, duration, token){
        const from = Number(window.__nebulaExpansion || 0);
        const opening = target > from;
        const startedAt = performance.now();
        return new Promise((resolve) => {
          const tick = (now) => {
            if (token !== transitionToken) {
              resolve(false);
              return;
            }
            const elapsed = clamp((now - startedAt) / duration, 0, 1);
            const openingPhase = clamp((elapsed - .06) / .94, 0, 1);
            const eased = opening
              ? 1 - Math.pow(1 - openingPhase, 3)
              : (elapsed < .5 ? 4 * elapsed * elapsed * elapsed : 1 - Math.pow(-2 * elapsed + 2, 3) / 2);
            window.__nebulaExpansion = from + (target - from) * eased;
            setNebulaReveal(window.__nebulaExpansion);
            if (elapsed < 1) {
              requestAnimationFrame(tick);
            } else {
              window.__nebulaExpansion = target;
              setNebulaReveal(target);
              resolve(true);
            }
          };
          requestAnimationFrame(tick);
        });
      }

      function animateVisualStep(target, duration, token){
        const from = Number(window.__nebulaProgress || 0) * STEP_COUNT;
        const startedAt = performance.now();
        return new Promise((resolve) => {
          const tick = (now) => {
            if (token !== transitionToken) {
              resolve(false);
              return;
            }
            const elapsed = clamp((now - startedAt) / duration, 0, 1);
            const eased = elapsed * (2 - elapsed);
            setNebulaVisualStep(from + (target - from) * eased);
            if (elapsed < 1) {
              requestAnimationFrame(tick);
            } else {
              setNebulaVisualStep(target);
              resolve(true);
            }
          };
          requestAnimationFrame(tick);
        });
      }

      function setNebulaStep(step, label){
        nebulaStep = Math.max(0, Math.min(STEP_COUNT, step));
        setNebulaVisualStep(nebulaStep);
        nebulaOverlay?.classList.toggle('done', nebulaStep === STEP_COUNT);
        if (label) {
          nebulaStatus.textContent = label;
        } else if (nebulaStep === 0) {
          nebulaStatus.textContent = '向右旋转点亮灯光';
        } else if (nebulaStep === STEP_COUNT) {
          nebulaStatus.textContent = '九盏灯已全部点亮';
        } else {
          nebulaStatus.textContent = '已点亮 ' + nebulaStep + ' / ' + STEP_COUNT + '：' + LIGHT_SEQUENCE[nebulaStep - 1].name;
        }
      }

      function setNebulaVisualStep(step){
        const visualStep = Math.max(0, Math.min(STEP_COUNT, Number(step) || 0));
        const progress = visualStep / STEP_COUNT;
        const energy = Math.pow(progress, .78);
        window.__nebulaProgress = progress;
        window.__nebulaEnergy = energy;
        nebulaOverlay?.style.setProperty('--nebula-level', String(progress));
        nebulaOverlay?.style.setProperty('--nebula-energy', String(energy));
        window.dispatchEvent(new CustomEvent('lw5-nebula-progress', { detail: { step: visualStep, progress, energy } }));
      }

      function pulseNebula(direction){
        if (nebulaBurst) {
          nebulaBurst.classList.remove('ignite', 'extinguish');
          void nebulaBurst.offsetWidth;
          nebulaBurst.classList.add(direction > 0 ? 'ignite' : 'extinguish');
        }
        window.dispatchEvent(new CustomEvent('lw5-nebula-ignite', { detail: { direction, step: nebulaStep } }));
      }

      async function showNebula(){
        if (!nebulaOverlay || nebulaMode !== 'mini') return;
        const token = ++transitionToken;
        nebulaMode = 'priming';
        syncSunGeometry();
        resetLocalControlConnection();
        commandQueue = Promise.resolve();
        nebulaOverlay.classList.remove('done', 'priming', 'collapsing', 'expanded', 'control-ready');
        nebulaBurst?.classList.remove('ignite', 'extinguish');
        nebulaOverlay.setAttribute('aria-hidden', 'false');
        nebulaStep = 0;
        nebulaStatus.textContent = '向右旋转点亮灯光';
        sunBtn.disabled = true;
        sunBtn.classList.add('working');
        document.body.classList.add('nebula-active');
        void nebulaOverlay.offsetWidth;
        nebulaOverlay.classList.add('priming');
        window.dispatchEvent(new CustomEvent('lw5-nebula-prime-start'));
        const primed = await animateVisualStep(0, PRIME_DURATION, token);
        if (!primed || token !== transitionToken) return;
        nebulaOverlay.classList.remove('priming');
        nebulaMode = 'expanding';
        void nebulaOverlay.offsetWidth;
        nebulaOverlay.classList.add('expanding');
        window.dispatchEvent(new CustomEvent('lw5-nebula-expand-start'));
        const completed = await animateExpansion(1, OPEN_DURATION, token);
        if (!completed || token !== transitionToken) return;
        nebulaOverlay.classList.remove('expanding');
        nebulaOverlay.classList.add('expanded', 'control-ready');
        nebulaMode = 'expanded';
        window.dispatchEvent(new CustomEvent('lw5-nebula-expanded'));
        connectLocalControl();
      }

      async function closeNebula(){
        if (!nebulaOverlay || nebulaMode !== 'expanded') return;
        const token = ++transitionToken;
        nebulaMode = 'collapsing';
        resetLocalControlConnection();
        nebulaOverlay.classList.remove('expanded', 'control-ready', 'done');
        nebulaOverlay.classList.add('collapsing');
        setNebulaStep(0);
        window.dispatchEvent(new CustomEvent('lw5-nebula-collapse-start'));
        const completed = await animateExpansion(0, CLOSE_DURATION, token);
        if (!completed || token !== transitionToken) return;
        nebulaOverlay.classList.remove('collapsing');
        nebulaOverlay.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('nebula-active');
        sunBtn.disabled = false;
        sunBtn.classList.remove('working');
        nebulaMode = 'mini';
        syncSunGeometry();
        window.dispatchEvent(new CustomEvent('lw5-nebula-collapse-complete'));
        animateVisualStep(HOME_VISUAL_STEP, 420, token);
      }

      async function sendLightCommand(light, on){
        if (VISUAL_TEST) {
          setLocalControlState('retry', '视觉测试模式：动画运行中，不发送灯光指令');
          return;
        }
        if (localConnectPromise) await localConnectPromise;
        if (!localControlConnected) {
          setLocalControlState('retry');
          return;
        }
        try {
          const response = await fetch(LOCAL_ORIGIN + '/api/sun-lights/' + light.loop + '/' + (on ? 'on' : 'off'), {
            method: 'POST',
            mode: 'cors',
            cache: 'no-store',
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error || '本地控制失败');
          localControlConnected = true;
          setLocalControlState('connected');
        } catch (error) {
          localControlConnected = false;
          setLocalControlState('retry');
        }
      }

      function moveNebulaStep(direction){
        if (!nebulaOverlay?.classList.contains('control-ready')) return;
        if (direction > 0 && nebulaStep >= STEP_COUNT) return;
        if (direction < 0 && nebulaStep <= 0) return;
        const nextStep = nebulaStep + direction;
        const light = direction > 0 ? LIGHT_SEQUENCE[nextStep - 1] : LIGHT_SEQUENCE[nebulaStep - 1];
        const label = '当前亮着 ' + nextStep + ' / ' + STEP_COUNT + ' 盏灯｜' + (direction > 0 ? '打开：' : '关闭：') + light.name;
        setNebulaStep(nextStep, label);
        pulseNebula(direction);
        commandQueue = commandQueue.then(() => sendLightCommand(light, direction > 0));
      }

      function pressSun(){
        if (!sunBtn || sunBtn.disabled) return;
        showNebula();
      }

      window.lw5NebulaControl = {
        get step(){ return nebulaStep; },
        get mode(){ return nebulaMode; },
        move: moveNebulaStep,
        preview: setNebulaVisualStep,
      };
      nebulaBack?.addEventListener('click', closeNebula);
      nebulaHint?.addEventListener('click', (event) => {
        if (nebulaMode !== 'expanded' || nebulaHint.getAttribute('aria-disabled') === 'true') {
          event.preventDefault();
          return;
        }
        nebulaHint.classList.remove('retry');
        nebulaHint.classList.add('connecting');
        nebulaHint.textContent = '正在进入本地控制…';
        rememberRecentLocalHandoff();
      });
      sunBtn?.addEventListener('click', pressSun);
      window.addEventListener('resize', syncSunGeometry, { passive:true });
      window.addEventListener('orientationchange', syncSunGeometry, { passive:true });
      requestAnimationFrame(() => {
        syncSunGeometry();
        setNebulaStep(0);
        setNebulaVisualStep(HOME_VISUAL_STEP);
      });
    })();

    (function(){
      // ===== BGM =====
      const bgm = document.getElementById('homeBgm');
      const btn = document.getElementById('musicBtn');
      const KEY = 'lw5_home_bgm_on_v1';
      let on = localStorage.getItem(KEY);
      if (on === null) on = '1'; // 默认开

      function syncBtn(){
        btn.textContent = on === '1' ? '🎵 音乐：开' : '🔇 音乐：关';
      }

      async function tryPlay(){
        if (!bgm || on !== '1') return;
        try {
          bgm.volume = 0.55;
          await bgm.play();
        } catch (e) {
          // iOS/微信常见：需要用户手势
          btn.textContent = '🎵 点我开音乐';
        }
      }

      btn.addEventListener('click', async () => {
        on = (on === '1') ? '0' : '1';
        localStorage.setItem(KEY, on);
        syncBtn();
        if (on === '1') {
          await tryPlay();
        } else {
          try { bgm.pause(); } catch(e) {}
        }
      });

      syncBtn();
      // 尝试自动播放；失败的话用户点按钮即可
      tryPlay();
      // 兜底：首次触摸/点击时再 kick 一次
      const kick = () => { tryPlay(); };
      window.addEventListener('touchstart', kick, { once:true, passive:true });
      window.addEventListener('click', kick, { once:true });

      // 切到后台/锁屏/切应用时自动停音乐；回到前台再按开关状态恢复
      document.addEventListener('visibilitychange', () => {
        if (!bgm) return;
        if (document.hidden) {
          try { bgm.pause(); } catch(e) {}
        } else {
          // 只有在开关为“开”时才尝试恢复
          if (on === '1') tryPlay();
        }
      });
      window.addEventListener('pagehide', () => {
        try { bgm.pause(); } catch(e) {}
      });

      // ===== Tool overlay (iframe) =====
      const overlay = document.getElementById('toolOverlay');
      const backdrop = document.getElementById('toolBackdrop');
      const panel = document.getElementById('toolPanel');
      const frame = document.getElementById('toolFrame');
      const closeBtn = document.getElementById('toolClose');
      const titleEl = document.getElementById('toolTitle');
      const loadingEl = document.getElementById('toolLoading');
      const loadingText = document.getElementById('toolLoadingText');
      const retryBtn = document.getElementById('toolRetry');
      const toolPages = {stock:'仓储管理',travel:'去玩咯',conflict:'分歧终端机'};
      const scrollPositions = new Map();
      let loadingTimer, currentTool = '', opener = null;

      function loadTool(retry = false) {
        clearTimeout(loadingTimer);
        panel.classList.add('loading');
        panel.setAttribute('aria-busy', 'true');
        loadingEl.hidden = false;
        loadingEl.classList.remove('failed');
        loadingText.textContent = '正在打开' + toolPages[currentTool] + '…';
        retryBtn.hidden = true;
        frame.src = './' + currentTool + '/' + (retry ? '?v=' + Date.now() : '');
        loadingTimer = setTimeout(() => {
          loadingEl.classList.add('failed');
          loadingText.textContent = '加载较慢或网络不可用';
          retryBtn.hidden = false;
        }, 12000);
      }

      function finishToolLoad() {
        if (!currentTool || !panel.classList.contains('loading')) return;
        try {
          if (!frame.contentWindow.location.pathname.endsWith('/' + currentTool + '/')) return;
          if (!frame.contentDocument.querySelector('body script')) throw new Error('Incomplete page');
          frame.contentWindow.scrollTo(0, scrollPositions.get(currentTool) || 0);
          clearTimeout(loadingTimer);
          panel.classList.remove('loading');
          panel.setAttribute('aria-busy', 'false');
          loadingEl.hidden = true;
        } catch (_) {
          clearTimeout(loadingTimer);
          loadingEl.classList.add('failed');
          loadingText.textContent = '页面未能加载，请重试';
          retryBtn.hidden = false;
        }
      }
      frame.addEventListener('load', finishToolLoad);
      retryBtn.addEventListener('click', () => loadTool(true));

      function openTool(tool){
        if (tool === 'wheel') { location.href = './wheel/'; return; }
        if (!overlay || !panel || !frame) return;
        if (!toolPages[tool] || currentTool === tool) return;
        currentTool = tool;
        opener = document.querySelector('[data-tool="' + tool + '"]');
        panel.classList.toggle('wheel-fullscreen', tool === 'wheel');

        if (tool === 'wheel'){
          panel.classList.remove('sheet');
          panel.classList.add('full');
          titleEl.textContent = '🍜🎡 美食转盘';
          frame.src = './wheel/?v=' + Date.now();
          location.hash = '#wheel';
        } else if (tool === 'stock'){
          panel.classList.remove('sheet');
          panel.classList.add('full');
          titleEl.textContent = '📦🏠 仓储管理';
          location.hash = '#stock';
        } else if (tool === 'travel'){
          panel.classList.remove('sheet');
          panel.classList.add('full');
          titleEl.textContent = '🏝️🧳 去玩咯';
          location.hash = '#travel';
        } else if (tool === 'conflict'){
          panel.classList.remove('sheet');
          panel.classList.add('full');
          titleEl.textContent = '💕🗣️ 分歧终端机';
          location.hash = '#conflict';
        }

        overlay.classList.add('show');
        overlay.setAttribute('aria-hidden','false');
        document.body.classList.add('tool-active');
        document.querySelector('main.card').inert = true;
        document.querySelectorAll('.music-btn').forEach(el => { el.inert = true; });
        frame.title = toolPages[tool];
        loadTool();
        closeBtn.focus({preventScroll:true});
      }

      function closeTool(){
        if (!overlay) return;
        if (!currentTool) return;
        try { scrollPositions.set(currentTool, frame.contentWindow.scrollY); } catch (_) {}
        currentTool = '';
        clearTimeout(loadingTimer);
        overlay.classList.remove('show');

      if (location.hash === '#stock') openTool('stock');
      if (location.hash === '#travel') openTool('travel');
      if (location.hash === '#conflict') openTool('conflict');

  <script type="module">

    function makeFallbackParticles() {

        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);
        const radius = .28 + Math.pow(Math.random(), .48) * 1.28;
        const palette = Math.random();
        return {
          x: Math.sin(phi) * Math.cos(theta) * radius,
          y: Math.cos(phi) * radius,
          z: Math.sin(phi) * Math.sin(theta) * radius,
          hue: palette < .50 ? 188 + Math.random() * 34 : (palette < .78 ? 42 + Math.random() * 18 : (palette < .92 ? 262 + Math.random() * 30 : 12 + Math.random() * 18)),

          orbit: Math.random() * Math.PI * 2,

    function initFallbackNebula() {

      ctx2d = canvas.getContext('2d');

    function drawFallbackNebula(time = 0) {

      const height = window.innerHeight || 1;

      const energy = Math.pow(progress, .78);
      const expansion = getExpansion();

      const sunRect = getSunRect();

      const fullCy = height * .47 + pointerY * 32;

      const cy = sunRect.centerY + (fullCy - sunRect.centerY) * expansion;

      const cosX = Math.cos(rx);

      glow.addColorStop(.54, 'rgba(87,218,255,' + (.09 + energy * .168) + ')');
      glow.addColorStop(.78, 'rgba(173,104,255,' + (.07 + energy * .09) + ')');

        ctx2d.restore();

      core.addColorStop(0, 'rgba(' + Math.round(158 + energy * 97) + ',' + Math.round(208 + energy * 47) + ',255,' + ((.40 + energy * .60) * miniCoreVisibility) + ')');

    function getNebulaPixelRatio() {

    function initNebula() {

      group = nebulaVisuals.root;
      overlay.classList.add('webgl-ready');
      document.getElementById('sunPress')?.classList.add('nebula-live');
      scene.add(group);

      window.addEventListener('resize', resizeNebula);

    function resizeNebula() {
      const width = window.innerWidth || 1;
      const height = window.innerHeight || 1;

        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
        return;

      if (!renderer || !camera) return;
      renderer.setSize(width, height, false);

      camera.position.z = Math.max(7.15, 2.05 / (Math.tan(camera.fov * Math.PI / 360) * Math.min(camera.aspect, 1) * .86));
      camera.updateProjectionMatrix();
    }

    function animateNebula(time = 0) {
      frame = requestAnimationFrame(animateNebula);
      const expansion = getExpansion();
      if (document.hidden || document.body.classList.contains('tool-active')) return;
      const miniIdle = expansion < .01 && !overlay?.classList.contains('expanding') && !overlay?.classList.contains('collapsing');
      if (miniIdle && time - lastRenderTime < 45) return;
      lastRenderTime = time;
      updateInteractionPhysics();
      const targetProgress = Math.max(0, Math.min(1, Number(window.__nebulaProgress || 0)));
      renderedProgress += (targetProgress - renderedProgress) * (pointerActive ? .24 : .14);
      if (Math.abs(targetProgress - renderedProgress) < .0005) renderedProgress = targetProgress;
      const energy = Math.pow(renderedProgress, .78);
      flashEnergy *= .885;
      if (fallbackMode) {
        drawFallbackNebula(time);
        return;
      }
      const miniFactor = 1 - expansion;
      const miniRotationBoost = 1 + miniFactor * 2.10;
      group.rotation.y += ((.0048 + energy * .0042) * miniRotationBoost + spinBoost * .036) * (reducedVisualMotion ? .2 : 1);
      group.rotation.x = Math.sin(time * .00042) * .24 + pointerY * .34 * expansion;
      group.rotation.z = Math.cos(time * .00032) * .10 - pointerX * .34 * expansion + spinBoost * .52;
      const viewportWidth = window.innerWidth || 1;
      const viewportHeight = window.innerHeight || 1;
      const sunRect = getSunRect();
      const worldHeight = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.position.z;
      const worldWidth = worldHeight * camera.aspect;
      const miniX = ((sunRect.centerX / viewportWidth) - .5) * worldWidth;
      const miniY = -((sunRect.centerY / viewportHeight) - .5) * worldHeight;
      group.position.x = miniX * (1 - expansion) + pointerX * .18 * expansion;
      group.position.y = miniY * (1 - expansion) - pointerY * .14 * expansion;
      nebulaVisuals.update({
        time, energy, drag:dragBoost, pulse:flashEnergy, direction:flashDirection,
        mini:miniFactor, renderer, camera, height:window.innerHeight || 1,
      });
      const miniSceneScale = (sunRect.width / viewportHeight) * worldHeight / 3.5;
      const sceneExpansionScale = miniSceneScale + (1 - miniSceneScale) * expansion;
      const scale = (.98 + energy * .028 + Math.sin(time * .0022) * .009 + dragBoost * .012) * sceneExpansionScale;
      group.scale.setScalar(scale);
      const miniExposure = 1.12 + energy * .34 + flashEnergy * .18;
      const fullExposure = .68 + energy * .74 + flashEnergy * .28;
      renderer.toneMappingExposure = miniExposure + (fullExposure - miniExposure) * expansion;

    }

    function startNebula() {
      initNebula();
      if (!frame) animateNebula();

    window.addEventListener('lw5-nebula-finish', startNebula);

    });
    window.addEventListener('lw5-nebula-prime-start', () => {
      setRenderQuality(false);
      flashDirection = -1;
      flashEnergy = .82;
      spinBoost = .62;
    });
    window.addEventListener('lw5-nebula-expand-start', () => {
      flashDirection = 1;
      flashEnergy = 1;
      spinBoost = 1.08;
    });

      requestAnimationFrame(() => setRenderQuality(true));
    });
    window.addEventListener('lw5-nebula-collapse-start', () => {
      pointerActive = false;
      dragAccumulator = 0;
      overlay?.classList.remove('interacting');
      flashDirection = -1;
      flashEnergy = .72;
    });
    window.addEventListener('lw5-nebula-collapse-complete', () => {
      pointerX = 0;
      pointerY = 0;
      targetPointerX = 0;
      targetPointerY = 0;
      spinBoost = 0;
      setTimeout(() => {
        if (getExpansion() < .01 && !overlay?.classList.contains('expanding')) {
          setRenderQuality(false);
        }
      }, 360);
    });
    if (overlay) {
      if ('requestIdleCallback' in window) requestIdleCallback(startNebula, {timeout:700});
      else setTimeout(startNebula, 160);
    }
