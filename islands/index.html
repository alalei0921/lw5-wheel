<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2c7776"><title>海岛手记 · LW&5</title><link rel="stylesheet" href="style.css"><body><header><a href="../">‹ 回家</a><span>LW & 5 · ISLAND JOURNAL</span></header><main><section class="hero"><div class="hero-copy"><small>把海风与快乐，留在这里</small><h1>我们的海岛手记</h1><p>一座岛，一次旅行，一起收藏的八种感受。</p><button id="new">＋ 记录一次旅行</button></div><div class="vacation-art" role="img" aria-label="两只小宝蛋在海岛沙滩度假"></div></section><aside><strong>仅保存在这台设备 · 未云同步</strong><p id="status" role="status" aria-live="polite">正在读取本地存档…</p><details><summary>云存档与备份</summary><p>既有清单云服务的私有访问权限尚待核实，海岛评分未接入云同步。请定期导出备份；清理浏览器数据可能移除本地存档。换设备可导入 JSON，同一记录有差异时保留两份。</p><button id="export">导出 JSON 备份</button><label class="button">导入备份<input id="import" type="file" accept="application/json,.json" hidden></label><button id="persist">请求浏览器长期保留</button><p id="retention"></p></details></aside><section id="records"></section><section id="editor" hidden><form id="form"><div class="heading"><h2 id="editTitle">记录旅行</h2><button type="button" id="cancel">取消编辑</button></div><label>海岛名称<input name="island" list="islands" required maxlength="120" placeholder="选择已有海岛，或手输入新名称"></label><datalist id="islands"></datalist><div class="dates"><label>旅行开始<input name="start" type="date"></label><label>旅行结束<input name="end" type="date"></label></div><p class="hint">日期可暂留空，待核实后补填；每次旅行单独保存。</p><div id="subjects"></div><button id="addHotel" type="button">＋ 添加酒店测评</button><label>旅行备注<textarea name="note" rows="3" maxlength="10000"></textarea></label><p id="source"></p><button id="save" type="submit">确认保存到本机</button><p id="saveState" role="status"></p></form></section></main><script type="module" src="app.js"></script></body></html>
