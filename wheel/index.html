<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050d16" />
  <meta name="description" content="LW&5 美食轮盘，投入小球，揭晓今天的美味。" />
  <title>LW&5 · 美食命运轮</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect width='80' height='80' rx='24' fill='%23071320'/%3E%3Ctext x='40' y='56' text-anchor='middle' font-size='56' fill='%237fffe0'%3E✦%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="room-view">
  <main class="casino-page">
    <section class="wheel-stage" aria-label="3D 美食轮盘">
      <div id="scene" tabindex="0" role="application" aria-label="赌场房间。上下左右拖动调整视角，点击轮盘或光束走近。Enter进入，方向键微调视角。"></div>
      <div class="fallback-wheel" id="fallbackWheel" hidden><canvas id="fallbackCanvas" width="900" height="900"></canvas></div>
      <button class="center-start" id="centerStart" tabindex="-1" aria-label="两只小狗 START，投球"><img src="./assets/start.png" alt="两只小狗，开始 START" draggable="false" /></button>
    </section>
    <div class="loading-mark" id="loadingMark"><span>正在点亮房间</span></div>
    <nav class="casino-nav" aria-label="页面操作">
      <a id="homeBtn" class="quiet-button" href="../">← 返回主页</a>
      <button class="quiet-button" id="muteBtn" aria-pressed="false"><span aria-hidden="true">♪</span><span id="soundText">音效开启</span></button>
    </nav>
    <div class="room-controls">
      <p id="roomHint" role="status" aria-live="polite">拖动微调视角 · 点击轮盘走近</p>
      <div><button id="enterRoom" class="quiet-button">走近轮盘 <span aria-hidden="true">↗</span></button><button id="motionBtn" class="quiet-button" aria-pressed="false" disabled>开启体感</button></div>
    </div>
    <div class="casino-dock" inert>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <div class="dock-buttons">
        <button id="resetView" class="quiet-button">↺ 回归视角</button>
        <button class="spin-button" id="spinBtn"><span id="spinText">投球</span><span aria-hidden="true">↗</span></button>
        <button class="quiet-button" id="menuBtn">查看菜单</button>
      </div>
      <div class="progress-track" aria-hidden="true"><div id="spinProgress"></div></div>
    </div>
  </main>
  <div class="celebration-flash" id="flash" aria-hidden="true"></div>

  <dialog id="resultDialog" class="result-dialog" aria-labelledby="resultTitle" aria-describedby="resultDescription">
    <button class="close-button" id="resultClose" aria-label="关闭结果">×</button>
    <div class="reward-art"><img src="./assets/reward-bg.jpg" alt="LW和5在温暖灯光下一起享用大餐"/><span class="art-badge">A TABLE FOR TWO</span></div>
    <div class="result-content"><p class="eyebrow" id="resultEyebrow">THE UNIVERSE HAS DECIDED</p><span class="result-symbol" id="resultSymbol" aria-hidden="true">✦</span><p class="result-kicker" id="resultKicker">今天的美味是</p><h2 id="resultTitle"></h2><p id="resultDescription">和你一起，吃什么都是好日子。</p><div class="result-actions"><button class="spin-button" id="acceptBtn">就吃这家 <span aria-hidden="true">♡</span></button><button class="quiet-button" id="againBtn">再投一次 <span aria-hidden="true">↻</span></button></div></div>
  </dialog>

  <dialog id="menuDialog" class="menu-dialog" aria-labelledby="menuTitle"><button class="close-button" id="menuClose" aria-label="关闭菜单">×</button><p class="eyebrow">SOMETHING DELICIOUS AWAITS</p><h2 id="menuTitle">今日菜单</h2><p class="menu-intro">19 个美食格子，由小球最终停留的位置决定。</p><div id="menuList" class="menu-list"></div><p class="menu-footnote"><i class="gold-dot"></i> 金色选项附送专属庆祝光效</p></dialog>
  <script type="module" src="./main.js"></script>
</body>
</html>
